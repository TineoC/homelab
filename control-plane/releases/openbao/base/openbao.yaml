# Standalone OpenBao with `file` storage. Per-cluster sizing and StorageClass
# come from overlay patches; everything else is shared.
# Seals on every pod restart: `bao operator init` once, then unseal.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  interval: 30m
  releaseName: openbao
  targetNamespace: openbao
  storageNamespace: openbao
  chart:
    spec:
      chart: openbao
      version: "0.29.4"
      sourceRef:
        kind: HelmRepository
        name: openbao
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    injector:
      enabled: false
    ui:
      enabled: true
    server:
      dataStorage:
        enabled: true
        size: 10Gi
      standalone:
        enabled: true
        config: |
          ui = true

          listener "tcp" {
            address     = "[::]:8200"
            tls_disable = 1
          }

          storage "file" {
            path = "/openbao/data"
          }
