apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
spec:
  interval: 30m
  releaseName: sealed-secrets
  targetNamespace: sealed-secrets
  storageNamespace: sealed-secrets
  chart:
    spec:
      chart: sealed-secrets
      version: "2.17.2"
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
  install:
    createNamespace: true
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
