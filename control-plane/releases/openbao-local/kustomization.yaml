apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - ../openbao/base
patches:
  # kind: smaller volume on the default `standard` StorageClass.
  - target:
      kind: HelmRelease
      name: openbao
    patch: |
      - op: replace
        path: /spec/values/server/dataStorage/size
        value: 1Gi
      - op: add
        path: /spec/values/server/dataStorage/storageClass
        value: standard
